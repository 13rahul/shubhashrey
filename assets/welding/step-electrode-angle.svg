<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Electrode angle for fillet welding">
  <rect width="480" height="320" fill="#f8fcfe"/>
  <text x="240" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0D3A52">ELECTRODE ANGLE  FILLET &amp; GROOVE</text>
  <path d="M80 240 L240 240 L240 120" fill="none" stroke="#64748b" stroke-width="8" stroke-linejoin="miter"/>
  <path d="M240 120 L400 240" fill="none" stroke="#64748b" stroke-width="8"/>
  <line x1="240" y1="120" x2="240" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="240" y1="180" x2="290" y2="130" stroke="#00AEEF" stroke-width="5"/>
  <circle cx="240" cy="180" r="6" fill="#0090C8"/>
  <text x="280" y="125" font-family="Arial,sans-serif" font-size="10" fill="#0078A8">Rod bisects</text>
  <text x="280" y="138" font-family="Arial,sans-serif" font-size="10" fill="#0078A8">the joint angle</text>
  <path d="M240 180 A40 40 0 0 0 268 155" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="255" y="172" font-family="Arial,sans-serif" font-size="9" fill="#16a34a">~45°</text>
  <rect x="30" y="55" width="180" height="50" rx="6" fill="#fff" stroke="#0090C8"/>
  <text x="120" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#0D3A52">Fillet (L-joint)</text>
  <text x="120" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">Perpendicular to weld line · angle splits corner</text>
  <rect x="270" y="55" width="180" height="50" rx="6" fill="#fff" stroke="#0090C8"/>
  <text x="360" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#0D3A52">If undercut on vertical leg</text>
  <text x="360" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">Tilt arc toward vertical member</text>
  <text x="240" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#0078A8">Common in gate frames, stair stringers, and platform brackets across Indian sites</text>
</svg>
