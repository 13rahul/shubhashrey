<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Arc length comparison diagram">
  <rect width="480" height="320" fill="#f8fcfe"/>
  <text x="240" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0D3A52">ARC LENGTH &amp; VOLTAGE</text>
  <line x1="40" y1="250" x2="440" y2="250" stroke="#64748b" stroke-width="4"/>
  <rect x="60" y="55" width="100" height="195" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <rect x="85" y="70" width="12" height="160" rx="4" fill="#00AEEF"/>
  <line x1="91" y1="55" x2="91" y2="35" stroke="#475569" stroke-width="3"/>
  <text x="91" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#dc2626">Long arc</text>
  <path d="M91 55 Q75 80 105 95 Q70 110 100 130" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <text x="110" y="140" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">Globules, spatter,</text>
  <text x="110" y="153" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">wide weak bead</text>
  <rect x="190" y="55" width="100" height="195" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <rect x="215" y="70" width="12" height="160" rx="4" fill="#00AEEF"/>
  <line x1="221" y1="55" x2="221" y2="48" stroke="#475569" stroke-width="2"/>
  <text x="221" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#16a34a">Correct</text>
  <path d="M221 55 L221 65" stroke="#fbbf24" stroke-width="2"/>
  <ellipse cx="221" cy="248" rx="30" ry="8" fill="#86efac" opacity="0.6"/>
  <text x="300" y="140" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">Short stable arc,</text>
  <text x="300" y="153" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">good fusion</text>
  <rect x="320" y="55" width="100" height="195" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <rect x="345" y="70" width="12" height="160" rx="4" fill="#00AEEF"/>
  <line x1="351" y1="55" x2="351" y2="62" stroke="#475569" stroke-width="2"/>
  <text x="351" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#d97706">Too short</text>
  <text x="430" y="140" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">Sticking, high bead,</text>
  <text x="430" y="153" font-family="Arial,sans-serif" font-size="9" fill="#4A6478">irregular ripples</text>
  <text x="240" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#0078A8">Rule of thumb: arc length H rod diameter (not including flux coating)</text>
</svg>
